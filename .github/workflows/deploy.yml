name: Publish
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'JS'
          import pkg from './package.json' with { type: 'json' };
          const { version } = pkg;
          if (process.env.RELEASE_TAG.replace(/^v/, '') !== version) {
            throw new Error('Release tag must match package.json');
          }
          if (version.split('+')[0].includes('-') !== (process.env.RELEASE_PRERELEASE === 'true')) {
            throw new Error('The GitHub prerelease flag must match the package version');
          }
          JS
      - run: pnpm run check
      - run: pnpm run check:types
      - run: pnpm run check:astro
      - run: pnpm run build
      - run: pnpm run wp:start
      - run: pnpm test
      - if: always()
        run: pnpm run wp:stop
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - name: Publish package using npm trusted publishing
        run: |
          tag=$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version.split('+')[0].includes('-') ? 'next' : 'latest');")
          pnpm publish --provenance --no-git-checks --tag "$tag"
